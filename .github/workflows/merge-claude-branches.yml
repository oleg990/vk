name: Merge Claude post branches

# Claude Code Routines пушит готовые посты в отдельную ветку сессии claude/<имя>
# (платформа не разрешает пушить прямо в main) — см. content/ROUTINE.md. Этот workflow
# подхватывает такую ветку сама и сливает в main, чтобы бот увидел новые посты без
# ручного вмешательства. Конфликты в content/queue.json и .gitignore резолвятся
# автоматически (tools/resolve_merge.py); что-то неожиданное — джоба падает, ветка
# остаётся нетронутой для ручного разбора.

on:
  push:
    branches:
      - "claude/**"

concurrency:
  group: merge-claude-branches
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Merge branch into main
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git merge-base --is-ancestor "origin/$BRANCH" HEAD; then
            echo "already merged, nothing to do"
            exit 0
          fi

          if git merge --no-ff -m "Merge posts from Claude session branch $BRANCH" "origin/$BRANCH"; then
            echo "clean merge"
          else
            conflicts=$(git diff --name-only --diff-filter=U)
            echo "conflicts in: $conflicts"
            known="" ; other=""
            for f in $conflicts; do
              if [ "$f" = "content/queue.json" ] || [ "$f" = ".gitignore" ]; then
                known="$known $f"
              else
                other="$other $f"
              fi
            done
            if [ -n "$other" ]; then
              echo "duplicate content (same post id from two sessions) — keeping main's version: $other"
              git checkout --ours -- $other
              git add $other
            fi
            if [ -n "$known" ]; then
              python3 tools/resolve_merge.py conflicts $known
              git add $known
            fi
            git commit -m "Merge posts from Claude session branch $BRANCH" --no-edit
          fi

          # Страховка: даже «чистое» слияние queue.json текстом может задвоить запись,
          # если правки не пересеклись по строкам — на каждый прогон гоняем дедуп.
          python3 tools/resolve_merge.py dedupe
          if ! git diff --quiet -- content/queue.json; then
            git add content/queue.json
            git commit -m "Dedupe content/queue.json after merging $BRANCH"
          fi

          git push origin main

      - name: Delete merged branch
        if: success()
        env:
          BRANCH: ${{ github.ref_name }}
        run: git push origin --delete "$BRANCH" || true
